server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # The age-selection page is the entry point: "/" serves start.html, which
    # then sends the visitor on to index.html (the main offer page).
    index start.html index.html;

    # Plain file serving. Do not add rewrites here: index.html links to
    # npm/bootstrap%2540... which must reach the on-disk directory
    # npm/bootstrap%40... unchanged. Re-processing the URI breaks all CSS.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpe?g|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
}
