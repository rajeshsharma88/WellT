services:
  wellness1:
    build: .
    image: wellness1:latest
    container_name: wellness1
    restart: unless-stopped
    # No published ports: Traefik runs in host network mode and reaches this
    # container on its bridge IP. Labels mirror the n8n service on the same
    # host, so TLS is issued by the shared "letsencrypt" resolver.
    labels:
      - traefik.enable=true
      - traefik.http.routers.wellness1.entrypoints=websecure
      - traefik.http.routers.wellness1.rule=Host(`wellness.aarogya.cloud`)
      - traefik.http.routers.wellness1.tls.certresolver=letsencrypt
      - traefik.http.services.wellness1.loadbalancer.server.port=80
