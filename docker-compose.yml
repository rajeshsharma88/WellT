services:
  vigourpro:
    build: .
    image: vigourpro:latest
    container_name: vigourpro
    restart: unless-stopped
    # Published on loopback for local health checks; Traefik (host network)
    # handles public ports 80/443 and TLS via the shared "letsencrypt" resolver.
    ports:
      - "127.0.0.1:8082:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.vigourpro-site.entrypoints=websecure
      - traefik.http.routers.vigourpro-site.rule=Host(`vigourpro.rajeshdiq.io`)
      - traefik.http.routers.vigourpro-site.tls.certresolver=letsencrypt
      - traefik.http.services.vigourpro.loadbalancer.server.port=80
